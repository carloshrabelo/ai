name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Chamado todo dia pela Action "Update data" (daily.yml), depois de gerar o cache dos eventos e
  # gravar venues e promoters: um push feito com o GITHUB_TOKEN não dispara este workflow sozinho.
  workflow_call:
    inputs:
      ref:
        description: 'Commit a publicar (padrão: o que disparou o workflow)'
        type: string
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Não publica se a formatação, o lint, o Knip (código sem uso) ou os testes falharem.
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm test

      # Ponta a ponta e acessibilidade (Playwright + axe), no mock: fluxos principais no celular e no desktop.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      # Cache dos eventos com a chave dos scripts: o prerender parte dele e não chama a API (a chave do
      # site só aceita o domínio, e o Node não manda Referer). Se a API falhar, usa o cache publicado.
      - name: Cache dos eventos
        if: ${{ vars.VITE_USE_MOCK == 'false' }}
        run: pnpm events:cache
        env:
          VITE_USE_MOCK: 'false'
          # Chave dos scripts; sem ela, a do site (os scripts usam a primeira que existir: scripts/lib/app.ts).
          VITE_GOOGLE_API_KEY_SCRIPTS: ${{ secrets.VITE_GOOGLE_API_KEY_SCRIPTS }}
          VITE_GOOGLE_API_KEY: ${{ secrets.VITE_GOOGLE_API_KEY }}

      - run: pnpm build
        env:
          GITHUB_PAGES: 'true'
          # Mock até a variável do repositório VITE_USE_MOCK ser "false" (Settings → Secrets and variables → Actions)
          VITE_USE_MOCK: ${{ vars.VITE_USE_MOCK || 'true' }}
          VITE_GOOGLE_API_KEY: ${{ secrets.VITE_GOOGLE_API_KEY }}
          # Código do site no GoatCounter (variável do repositório); vazio = analytics desligado
          VITE_GOATCOUNTER_CODE: ${{ vars.VITE_GOATCOUNTER_CODE }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

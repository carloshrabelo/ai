name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Chamado pela Action "Update venues" depois de gravar o venues.json: um push feito com o
  # GITHUB_TOKEN não dispara este workflow sozinho.
  workflow_call:
    inputs:
      ref:
        description: 'Commit a publicar (padrão: o que disparou o workflow)'
        type: string
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Não publica se o lint ou os testes falharem.
      - run: pnpm lint
      - run: pnpm test

      - run: pnpm build
        env:
          GITHUB_PAGES: 'true'
          # Mock até a variável do repositório VITE_USE_MOCK ser "false" (Settings → Secrets and variables → Actions)
          VITE_USE_MOCK: ${{ vars.VITE_USE_MOCK || 'true' }}
          VITE_GOOGLE_API_KEY: ${{ secrets.VITE_GOOGLE_API_KEY }}
          # Código do site no GoatCounter (variável do repositório); vazio = analytics desligado
          VITE_GOATCOUNTER_CODE: ${{ vars.VITE_GOATCOUNTER_CODE }}

      # Fallback de SPA: rotas como /ai/about servem o index.html
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

    <!-- Teste de tema estilo Duolingo: Nunito e Fredoka (Google Fonts), alternativas livres às fontes
         do Duolingo (Feather Bold é proprietária; DIN Next Rounded é comercial). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800;900&display=swap"

    />

    <link rel="icon" href="/pwa-64x64.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <meta name="theme-color" content="#ffffff" />
    <script>
      // Aplica o tema antes do primeiro paint (mesma lógica e cores — THEME_COLOR — de src/theme/useTheme.ts).
      ;(function () {
        var mode = 'system'
        try {
          mode = localStorage.getItem('theme') || 'system'
        } catch (e) {}
        var dark = mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#131f24' : '#ffffff')
      })()
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lisbon Dance" />
  </head>
